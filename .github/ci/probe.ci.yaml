# Minimal probe config used only by CI's container smoke test.
# Short windows so a run finishes inside a job; not a template for real use.
wan:
  id: ci-probe
  label: "CI smoke test"
  kind: under_test

server:
  port: 9109
  export_token: "ci-token"

storage:
  data_dir: /var/lib/ispbust

icmp:
  window_seconds: 10
  packet_interval_ms: 500
  timeout_ms: 1000
  targets:
    - host: 1.1.1.1
      role: anchor
    - host: 8.8.8.8
      role: anchor

upstream_discovery:
  # Runners sit behind NAT with an unpredictable path; discovery would only
  # exercise the rejection guard, which the unit tests already cover.
  enabled: false

dns:
  enabled: true
  interval_seconds: 10
  names: [example.com]
  resolvers:
    - ip: 1.1.1.1
      role: public_control

tcp:
  enabled: true
  interval_seconds: 15
  targets:
    - host: cloudflare.com
      port: 443
      tls: true

traceroute:
  enabled: false
